# LiteLLM 設定ファイル
# vLLM をバックエンドとして登録、API キー認証を有効化
#
# モデル死活は推論プローブ（"test from litellm"）ではなく、
# vllm-manager UI の「HTTP ヘルスチェック」または vLLM GET /health で確認する。
#
# 注意:
# - chat/completions は本ファイルの openai/* ワイルドカードで backend へ転送する
# - embeddings / score / rerank は litellm-gateway (nginx) が backend へ直パススルーする
#   （LiteLLM の openai プロバイダは /v1/rerank 非対応のため）
# - 固定モデル ID の列挙は不要。起動中インスタンスは Manager が振り分ける

general_settings:
  health_check_skip_disabled_background_models: true

model_list:
  # 汎用ルーティング（chat）:
  # - モデル名を固定せず、backend(/v1/*) 側で起動中 vLLM へ動的にルーティングする
  - model_name: "vllm-local"
    model_info:
      mode: completion
      disable_background_health_check: true
    litellm_params:
      model: openai/vllm-local
      api_key: "sk-no-key-required"
      api_base: http://backend:8000/v1
      rpm: 10000
      pass_through_optional_params: true
      # vLLM Manager が /v1 プロキシで同時リクエスト・トークンを追跡するための識別子
      extra_headers:
        X-Vllm-Manager-Source: litellm
  # Claude Code からの利用向けエイリアス
  - model_name: "claude-vllm-local"
    model_info:
      mode: completion
      disable_background_health_check: true
    litellm_params:
      model: openai/vllm-local
      api_key: "sk-no-key-required"
      api_base: http://backend:8000/v1
      rpm: 10000
      pass_through_optional_params: true
      extra_headers:
        X-Vllm-Manager-Source: litellm
  # 任意モデル名を受けるワイルドカード（chat。embedding/rerank は gateway 経由）
  # model: openai/* でリクエストされたモデル名をそのまま backend へパススルーする。
  # backend 側はモデル名一致で対象 vLLM インスタンスを選び、同名複数台は
  # ラウンドロビンで分散する（app/main.py の _pick_target_server）。
  - model_name: "*"
    model_info:
      mode: completion
      disable_background_health_check: true
    litellm_params:
      model: openai/*
      api_key: "sk-no-key-required"
      api_base: http://backend:8000/v1
      rpm: 10000
      pass_through_optional_params: true
      extra_headers:
        X-Vllm-Manager-Source: litellm

# 環境変数で制御する項目
# LITELLM_MASTER_KEY: sk-vllm-manager-xxxx  (API キー)
# LITELLM_DROP_PARAMS: true
