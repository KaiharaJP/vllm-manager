# LiteLLM 設定ファイル
# vLLM をバックエンドとして登録、API キー認証を有効化
#
# モデル死活は推論プローブ（"test from litellm"）ではなく、
# vllm-manager UI の「HTTP ヘルスチェック」または vLLM GET /health で確認する。

general_settings:
  health_check_skip_disabled_background_models: true

model_list:
  # 汎用ルーティング:
  # - モデル名を固定せず、backend(/v1/*) 側で起動中 vLLM へ動的にルーティングする
  # - 具体的なモデルIDをここに書かなくても、起動済みモデルへ転送される
  - model_name: "vllm-local"
    model_info:
      mode: completion
      disable_background_health_check: true
    litellm_params:
      model: openai/vllm-local
      api_key: "sk-no-key-required"
      api_base: http://backend:8000/v1
      rpm: 10000
      pass_through_optional_params: true
      # vLLM Manager が /v1 プロキシで同時リクエスト・トークンを追跡するための識別子
      extra_headers:
        X-Vllm-Manager-Source: litellm
  # Claude Code からの利用向けエイリアス
  # - Claude Code の --model で指定しやすい名前を追加
  - model_name: "claude-vllm-local"
    model_info:
      mode: completion
      disable_background_health_check: true
    litellm_params:
      model: openai/vllm-local
      api_key: "sk-no-key-required"
      api_base: http://backend:8000/v1
      rpm: 10000
      pass_through_optional_params: true
      extra_headers:
        X-Vllm-Manager-Source: litellm
  # 任意モデル名を受けるワイルドカード（実際の転送先は backend 側で解決）
  - model_name: "*"
    model_info:
      mode: completion
      disable_background_health_check: true
    litellm_params:
      model: openai/vllm-local
      api_key: "sk-no-key-required"
      api_base: http://backend:8000/v1
      rpm: 10000
      pass_through_optional_params: true
      extra_headers:
        X-Vllm-Manager-Source: litellm

# 環境変数で制御する項目
# LITELLM_MASTER_KEY: sk-vllm-manager-xxxx  (API キー)
# LITELLM_DROP_PARAMS: true
