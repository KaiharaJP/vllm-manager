worker_processes auto;

events {
  worker_connections 1024;
}

http {
  # 大コンテキスト prefill 向け（デフォルト 60s だと 504 になりやすい）
  proxy_connect_timeout 60s;
  proxy_read_timeout 600s;
  proxy_send_timeout 600s;
  client_body_timeout 600s;

  # LiteLLM を経由せず backend へ渡すときの共通ヘッダ
  # （起動中の任意 chat/embedding/rerank を Manager が model id + task_type で振り分ける）
  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  server {
    listen 4000;
    server_name _;

    # `/v1/models` は backend の動的モデル一覧に委譲する。
    location = /v1/models {
      proxy_pass http://backend:8000/v1/models;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Authorization $http_authorization;
      proxy_set_header X-Vllm-Manager-Source litellm;
    }

    # embedding / score / rerank も固定カタログではなく Manager へパススルー。
    # LiteLLM の openai/* ワイルドカードは /v1/rerank で Unsupported provider になるため回避する。
    location = /v1/embeddings {
      proxy_pass http://backend:8000/v1/embeddings;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Authorization $http_authorization;
      proxy_set_header Content-Type $content_type;
      proxy_set_header X-Vllm-Manager-Source litellm;
    }

    location = /v1/score {
      proxy_pass http://backend:8000/v1/score;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Authorization $http_authorization;
      proxy_set_header Content-Type $content_type;
      proxy_set_header X-Vllm-Manager-Source litellm;
    }

    location = /score {
      proxy_pass http://backend:8000/score;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Authorization $http_authorization;
      proxy_set_header Content-Type $content_type;
      proxy_set_header X-Vllm-Manager-Source litellm;
    }

    # クライアントの /v1/rerank は Manager の /rerank（vLLM 互換）へ寄せる
    location = /v1/rerank {
      proxy_pass http://backend:8000/rerank;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Authorization $http_authorization;
      proxy_set_header Content-Type $content_type;
      proxy_set_header X-Vllm-Manager-Source litellm;
    }

    location = /rerank {
      proxy_pass http://backend:8000/rerank;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Authorization $http_authorization;
      proxy_set_header Content-Type $content_type;
      proxy_set_header X-Vllm-Manager-Source litellm;
    }

    location = /v2/rerank {
      proxy_pass http://backend:8000/v2/rerank;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Authorization $http_authorization;
      proxy_set_header Content-Type $content_type;
      proxy_set_header X-Vllm-Manager-Source litellm;
    }

    # chat/completions 等は既存 LiteLLM に透過転送（キー・予算・エイリアス）。
    location / {
      proxy_pass http://litellm:4000;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Authorization $http_authorization;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
    }
  }
}
